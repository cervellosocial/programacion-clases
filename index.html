<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tenis Copilot - Planificador Inteligente</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js" crossorigin></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background-color: #F8F6F0;
    color: #1C2417;
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;

const STORAGE_KEY = "tenis-copilot-data";

const CATEGORIAS_EJERCICIO = ["Calentamiento", "Cesta / Cubo", "Peloteo / Control", "Situación de Juego", "Físico / Agilidad"];
const NIVELES = ["Iniciación", "Intermedio", "Avanzado / Competición"];

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2);
const fechaHoy = () => new Date().toISOString().slice(0, 10);

const DATA_INICIAL = {
  apiKey: "",
  apiProveedor: "openai", // "openai" o "gemini"
  grupos: [
    { id: "g1", nombre: "Grupo Infantil A", nivel: "Iniciación", dias: "Lunes y Miércoles 17:00", objetivo: "Consistencia de fondo y empuñadura de derecha" }
  ],
  alumnos: [
    { 
      id: "a1", 
      grupoId: "g1", 
      nombre: "Marc", 
      fortalezas: "Buena velocidad y movilidad", 
      aMejorar: "Empuñadura de revés demasiado corta",
      historial: [
        { id: "h1", fecha: "2026-09-15", nota: "Inicio de curso. Le cuesta el armado de revés." },
        { id: "h2", fecha: "2026-11-10", nota: "Mejora notable en el impacto de derecha." }
      ]
    }
  ],
  ejercicios: [
    { id: "e1", titulo: "Diana en el fondo", categoria: "Cesta / Cubo", nivel: "Iniciación", descripcion: "Lanzamiento con cesta hacia conos en las esquinas profundas." },
    { id: "e2", titulo: "Rayo de Volea", categoria: "Situación de Juego", nivel: "Iniciación", descripcion: "Red contra fondo a un bote obligatorio." }
  ],
  diario: []
};

function App() {
  const [data, setData] = useState(DATA_INICIAL);
  const [tab, setTab] = useState("grupos");
  const [settingsOpen, setSettingsOpen] = useState(false);
  const fileInputRef = useRef(null);

  useEffect(() => {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      try { 
        const parsed = JSON.parse(raw);
        setData(prev => ({ ...prev, ...parsed })); 
      } catch(e) { console.error(e); }
    }
  }, []);

  useEffect(() => {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }, [data]);

  const updateData = (key, newValue) => {
    setData(prev => ({ ...prev, [key]: newValue }));
  };

  // ✅ No exportar la API Key en los backups por seguridad
  const exportarJSON = () => {
    const copiaSegura = { ...data, apiKey: "" };
    const blob = new Blob([JSON.stringify(copiaSegura, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `tenis-copilot-backup.json`;
    a.click();
    URL.revokeObjectURL(url);
  };

  const importarJSON = (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (event) => {
      try {
        const parsed = JSON.parse(event.target.result);
        // Mantener la API key que ya tenía configurada el usuario si no viene una nueva
        setData(prev => ({
          ...parsed,
          apiKey: parsed.apiKey || prev.apiKey || "",
          apiProveedor: parsed.apiProveedor || prev.apiProveedor || "openai"
        }));
        alert("¡Datos cargados correctamente!");
      } catch (err) { alert("Archivo no válido."); }
    };
    reader.readAsText(file);
  };

  return (
    <div className="min-h-screen pb-12">
      {/* Header */}
      <header className="bg-[#1F3D2B] text-white px-6 py-4 shadow-md">
        <div className="max-w-6xl mx-auto flex items-center justify-between">
          <div className="flex items-center gap-3">
            <div className="w-10 h-10 rounded-xl bg-[#C9D94A] text-[#1F3D2B] flex items-center justify-center font-black text-xl">
              🎾
            </div>
            <div>
              <h1 className="text-xl font-extrabold tracking-tight">Tenis Copilot</h1>
              <p className="text-xs text-emerald-200">Asistente Metodológico de Entrenamiento</p>
            </div>
          </div>
          <button 
            onClick={() => setSettingsOpen(!settingsOpen)}
            className="bg-white/10 hover:bg-white/20 text-white text-xs px-3 py-2 rounded-lg transition-colors border border-white/10 flex items-center gap-1.5"
          >
            ⚙️ <span>Configuración API</span>
            {data.apiKey ? <span className="w-2 h-2 rounded-full bg-emerald-400"></span> : <span className="w-2 h-2 rounded-full bg-amber-400"></span>}
          </button>
        </div>
      </header>

      {/* Panel de Ajustes / API Key */}
      {settingsOpen && (
        <div className="bg-amber-50 border-b border-amber-200 p-4">
          <div className="max-w-6xl mx-auto flex flex-col md:flex-row gap-4 justify-between items-start md:items-center">
            <div className="flex-1 w-full flex flex-col sm:flex-row gap-3">
              <div className="w-36">
                <label className="text-xs font-bold text-amber-900 block mb-1">Proveedor IA</label>
                <select 
                  value={data.apiProveedor || "openai"} 
                  onChange={(e) => updateData("apiProveedor", e.target.value)}
                  className="w-full bg-white border border-amber-300 rounded-lg p-1.5 text-xs outline-none font-semibold"
                >
                  <option value="openai">OpenAI (ChatGPT)</option>
                  <option value="gemini">Google Gemini</option>
                </select>
              </div>
              <div className="flex-1">
                <label className="text-xs font-bold text-amber-900 block mb-1">API Key ({data.apiProveedor === "openai" ? "sk-..." : "AIzaSy..."})</label>
                <input 
                  type="password" 
                  placeholder={data.apiProveedor === "openai" ? "sk-proj-..." : "AIzaSy..."} 
                  value={data.apiKey || ""} 
                  onChange={(e) => updateData("apiKey", e.target.value)}
                  className="w-full bg-white border border-amber-300 rounded-lg px-3 py-1.5 text-xs outline-none"
                />
              </div>
            </div>
            <div className="flex gap-2 self-end md:self-center">
              <button onClick={exportarJSON} className="bg-white border border-amber-300 text-amber-900 text-xs px-3 py-1.5 rounded-lg font-semibold hover:bg-amber-100">Exportar Backup</button>
              <button onClick={() => fileInputRef.current?.click()} className="bg-white border border-amber-300 text-amber-900 text-xs px-3 py-1.5 rounded-lg font-semibold hover:bg-amber-100">Importar Backup</button>
              <input ref={fileInputRef} type="file" accept="application/json" className="hidden" onChange={importarJSON} />
            </div>
          </div>
        </div>
      )}

      {/* Navegación por pestañas */}
      <div className="bg-white border-b border-[#E3DFD3] sticky top-0 z-10 shadow-xs">
        <div className="max-w-6xl mx-auto flex gap-2 px-6 overflow-x-auto">
          {[
            ["grupos", "👥 Grupos"],
            ["alumnos", "👦 Alumnos & Evolución"],
            ["ejercicios", "📚 Biblioteca de Ejercicios"],
            ["diario", "📅 Diario de Clases"],
            ["ia", "🤖 Copiloto IA"]
          ].map(([k, label]) => (
            <button
              key={k}
              onClick={() => setTab(k)}
              className={`py-3.5 px-4 font-bold text-xs transition-all border-b-2 whitespace-nowrap ${tab === k ? "border-[#1F3D2B] text-[#1F3D2B]" : "border-transparent text-gray-400 hover:text-gray-600"}`}
            >
              {label}
            </button>
          ))}
        </div>
      </div>

      {/* Contenido Principal */}
      <main className="max-w-6xl mx-auto px-6 pt-6">
        {tab === "grupos" && <TabGrupos data={data} updateData={updateData} />}
        {tab === "alumnos" && <TabAlumnos data={data} updateData={updateData} />}
        {tab === "ejercicios" && <TabEjercicios data={data} updateData={updateData} />}
        {tab === "diario" && <TabDiario data={data} updateData={updateData} />}
        {tab === "ia" && <TabIA data={data} updateData={updateData} />}
      </main>
    </div>
  );
}

// ------------------- PESTAÑA GRUPOS -------------------
function TabGrupos({ data, updateData }) {
  const [nombre, setNombre] = useState("");
  const [nivel, setNivel] = useState(NIVELES[0]);
  const [dias, setDias] = useState("");
  const [objetivo, setObjetivo] = useState("");

  const agregarGrupo = (e) => {
    e.preventDefault();
    if (!nombre.trim()) return;
    const nuevo = { id: uid(), nombre: nombre.trim(), nivel, dias: dias.trim(), objetivo: objetivo.trim() };
    updateData("grupos", [...data.grupos, nuevo]);
    setNombre(""); setDias(""); setObjetivo("");
  };

  const eliminarGrupo = (id) => {
    updateData("grupos", data.grupos.filter(g => g.id !== id));
    updateData("alumnos", data.alumnos.filter(a => a.grupoId !== id));
  };

  return (
    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
      <form onSubmit={agregarGrupo} className="bg-white p-5 rounded-2xl border border-[#E3DFD3] shadow-xs h-fit flex flex-col gap-3">
        <h3 className="font-bold text-sm text-gray-800">Crear Nuevo Grupo</h3>
        <div>
          <label className="text-xs font-semibold text-gray-500 block mb-1">Nombre del Grupo</label>
          <input type="text" required placeholder="Ej: Benjamines Nivel II" value={nombre} onChange={e => setNombre(e.target.value)} className="w-full border rounded-xl p-2 text-xs outline-none focus:border-[#1F3D2B]" />
        </div>
        <div>
          <label className="text-xs font-semibold text-gray-500 block mb-1">Nivel</label>
          <select value={nivel} onChange={e => setNivel(e.target.value)} className="w-full border rounded-xl p-2 text-xs outline-none">
            {NIVELES.map(n => <option key={n}>{n}</option>)}
          </select>
        </div>
        <div>
          <label className="text-xs font-semibold text-gray-500 block mb-1">Horario / Días</label>
          <input type="text" placeholder="Ej: Mar y Jue 18:00" value={dias} onChange={e => setDias(e.target.value)} className="w-full border rounded-xl p-2 text-xs outline-none" />
        </div>
        <div>
          <label className="text-xs font-semibold text-gray-500 block mb-1">Objetivo de la Etapa</label>
          <textarea placeholder="Ej: Mejorar consistencia de fondo e iniciación al saque" value={objetivo} onChange={e => setObjetivo(e.target.value)} className="w-full border rounded-xl p-2 text-xs outline-none h-20" />
        </div>
        <button type="submit" className="bg-[#1F3D2B] text-white text-xs font-bold py-2.5 rounded-xl hover:bg-[#2F5741] transition-colors">Añadir Grupo</button>
      </form>

      <div className="md:col-span-2 flex flex-col gap-3">
        {data.grupos.map(g => {
          const numAlumnos = data.alumnos.filter(a => a.grupoId === g.id).length;
          return (
            <div key={g.id} className="bg-white p-5 rounded-2xl border border-[#E3DFD3] shadow-xs flex justify-between items-start">
              <div>
                <div className="flex items-center gap-2 mb-1">
                  <h4 className="font-bold text-base text-gray-800">{g.nombre}</h4>
                  <span className="bg-emerald-100 text-emerald-800 text-[10px] font-bold px-2 py-0.5 rounded-full">{g.nivel}</span>
                  <span className="bg-gray-100 text-gray-600 text-[10px] font-bold px-2 py-0.5 rounded-full">👥 {numAlumnos} alumnos</span>
                </div>
                <p className="text-xs font-semibold text-gray-500 mb-2">🗓️ {g.dias || "Sin horario especificado"}</p>
                {g.objetivo && (
                  <p className="text-xs text-gray-600 bg-[#F8F6F0] p-2.5 rounded-xl border border-gray-200/50">
                    <strong>Objetivo:</strong> {g.objetivo}
                  </p>
                )}
              </div>
              <button onClick={() => eliminarGrupo(g.id)} className="text-xs text-red-500 hover:bg-red-50 p-1 rounded">✕</button>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ------------------- PESTAÑA ALUMNOS & EVOLUCIÓN -------------------
function TabAlumnos({ data, updateData }) {
  const [grupoId, setGrupoId] = useState(data.grupos[0]?.id || "");
  const [nombre, setNombre] = useState("");
  const [fortalezas, setFortalezas] = useState("");
  const [aMejorar, setAMejorar] = useState("");
  
  const [editandoAlumno, setEditandoAlumno] = useState(null);
  const [alumnoEvolucion, setAlumnoEvolucion] = useState(null);
  const [nuevaNotaEvolucion, setNuevaNotaEvolucion] = useState("");

  const agregarOGuardarAlumno = (e) => {
    e.preventDefault();
    if (!nombre.trim() || !grupoId) return;

    if (editandoAlumno) {
      const actualizados = data.alumnos.map(a => {
        if (a.id === editandoAlumno.id) {
          return { ...a, grupoId, nombre: nombre.trim(), fortalezas: fortalezas.trim(), aMejorar: aMejorar.trim() };
        }
        return a;
      });
      updateData("alumnos", actualizados);
      setEditandoAlumno(null);
    } else {
      const nuevo = { 
        id: uid(), 
        grupoId, 
        nombre: nombre.trim(), 
        fortalezas: fortalezas.trim(), 
        aMejorar: aMejorar.trim(),
        historial: [{ id: uid(), fecha: fechaHoy(), nota: "Alta en el grupo." }] 
      };
      updateData("alumnos", [...data.alumnos, nuevo]);
    }

    setNombre(""); setFortalezas(""); setAMejorar("");
  };

  const iniciarEdicion = (alumno) => {
    setEditandoAlumno(alumno);
    setGrupoId(alumno.grupoId);
    setNombre(alumno.nombre);
    setFortalezas(alumno.fortalezas || "");
    setAMejorar(alumno.aMejorar || "");
  };

  const cancelarEdicion = () => {
    setEditandoAlumno(null);
    setNombre(""); setFortalezas(""); setAMejorar("");
  };

  const eliminarAlumno = (id) => {
    updateData("alumnos", data.alumnos.filter(a => a.id !== id));
  };

  const agregarHitoEvolucion = (e) => {
    e.preventDefault();
    if (!nuevaNotaEvolucion.trim() || !alumnoEvolucion) return;

    const nuevaEntrada = { id: uid(), fecha: fechaHoy(), nota: nuevaNotaEvolucion.trim() };
    const actualizados = data.alumnos.map(a => {
      if (a.id === alumnoEvolucion.id) {
        return { ...a, historial: [nuevaEntrada, ...(a.historial || [])] };
      }
      return a;
    });

    updateData("alumnos", actualizados);
    setAlumnoEvolucion(prev => ({ ...prev, historial: [nuevaEntrada, ...(prev.historial || [])] }));
    setNuevaNotaEvolucion("");
  };

  const eliminarHitoHistorial = (alumnoId, hitoId) => {
    const actualizados = data.alumnos.map(a => {
      if (a.id === alumnoId) {
        return { ...a, historial: a.historial.filter(h => h.id !== hitoId) };
      }
      return a;
    });
    updateData("alumnos", actualizados);
    setAlumnoEvolucion(prev => ({ ...prev, historial: prev.historial.filter(h => h.id !== hitoId) }));
  };

  return (
    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
      <form onSubmit={agregarOGuardarAlumno} className="bg-white p-5 rounded-2xl border border-[#E3DFD3] shadow-xs h-fit flex flex-col gap-3">
        <div className="flex justify-between items-center">
          <h3 className="font-bold text-sm text-gray-800">{editandoAlumno ? "✏️ Editar Alumno" : "Registrar Alumno"}</h3>
          {editandoAlumno && (
            <button type="button" onClick={cancelarEdicion} className="text-xs text-gray-400 hover:text-gray-600">Cancelar</button>
          )}
        </div>
        <div>
          <label className="text-xs font-semibold text-gray-500 block mb-1">Grupo Asignado</label>
          <select value={grupoId} onChange={e => setGrupoId(e.target.value)} className="w-full border rounded-xl p-2 text-xs outline-none">
            {data.grupos.map(g => <option key={g.id} value={g.id}>{g.nombre}</option>)}
          </select>
        </div>
        <div>
          <label className="text-xs font-semibold text-gray-500 block mb-1">Nombre</label>
          <input type="text" required placeholder="Nombre del alumno" value={nombre} onChange={e => setNombre(e.target.value)} className="w-full border rounded-xl p-2 text-xs outline-none" />
        </div>
        <div>
          <label className="text-xs font-semibold text-gray-500 block mb-1">Puntos Fuertes / Virtudes</label>
          <input type="text" placeholder="Ej: Buena actitud, golpe de derecha potente" value={fortalezas} onChange={e => setFortalezas(e.target.value)} className="w-full border rounded-xl p-2 text-xs outline-none" />
        </div>
        <div>
          <label className="text-xs font-semibold text-gray-500 block mb-1">Aspectos Técnicos / Tácticos a Mejorar</label>
          <textarea placeholder="Ej: Falla en la preparación del revés, se precipita" value={aMejorar} onChange={e => setAMejorar(e.target.value)} className="w-full border rounded-xl p-2 text-xs outline-none h-20" />
        </div>
        <button type="submit" className="bg-[#1F3D2B] text-white text-xs font-bold py-2.5 rounded-xl hover:bg-[#2F5741]">
          {editandoAlumno ? "Guardar Cambios" : "Añadir Alumno"}
        </button>
      </form>

      <div className="md:col-span-2 flex flex-col gap-4">
        {data.grupos.map(g => {
          const alumnosGrupo = data.alumnos.filter(a => a.grupoId === g.id);
          return (
            <div key={g.id} className="bg-white p-5 rounded-2xl border border-[#E3DFD3] shadow-xs">
              <h4 className="font-bold text-sm text-gray-800 border-b pb-2 mb-3 flex justify-between">
                <span>{g.nombre}</span>
                <span className="text-xs font-normal text-gray-400">{alumnosGrupo.length} alumnos</span>
              </h4>
              {alumnosGrupo.length === 0 ? (
                <p className="text-xs text-gray-400 italic">No hay alumnos registrados en este grupo.</p>
              ) : (
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  {alumnosGrupo.map(a => (
                    <div key={a.id} className="p-3 bg-[#F8F6F0] rounded-xl border border-gray-200/60 flex flex-col justify-between">
                      <div>
                        <div className="flex justify-between items-start mb-1">
                          <span className="font-bold text-xs text-gray-800">{a.nombre}</span>
                          <div className="flex items-center gap-1">
                            <button onClick={() => iniciarEdicion(a)} title="Editar datos" className="text-xs text-gray-400 hover:text-blue-600 p-0.5">✏️</button>
                            <button onClick={() => eliminarAlumno(a.id)} title="Eliminar alumno" className="text-xs text-gray-400 hover:text-red-500 p-0.5">✕</button>
                          </div>
                        </div>
                        {a.fortalezas && <p className="text-[11px] text-emerald-700"><strong>+</strong> {a.fortalezas}</p>}
                        {a.aMejorar && <p className="text-[11px] text-amber-700"><strong>△</strong> {a.aMejorar}</p>}
                      </div>

                      <button 
                        onClick={() => setAlumnoEvolucion(a)}
                        className="mt-3 pt-2 border-t border-gray-200/80 text-[11px] text-[#1F3D2B] font-bold flex items-center justify-between hover:underline"
                      >
                        <span>📈 Evolución ({(a.historial || []).length} registros)</span>
                        <span>→</span>
                      </button>
                    </div>
                  ))}
                </div>
              )}
            </div>
          );
        })}
      </div>

      {alumnoEvolucion && (
        <div className="fixed inset-0 bg-black/40 backdrop-blur-xs flex items-center justify-center z-50 p-4">
          <div className="bg-white rounded-2xl max-w-md w-full p-5 shadow-xl border border-gray-100 max-h-[85vh] flex flex-col">
            <div className="flex justify-between items-start border-b pb-3 mb-3">
              <div>
                <h3 className="font-bold text-sm text-gray-800">Evolución de {alumnoEvolucion.nombre}</h3>
                <p className="text-[11px] text-gray-400">Historial continuo de progreso</p>
              </div>
              <button onClick={() => setAlumnoEvolucion(null)} className="text-gray-400 hover:text-gray-600 font-bold">✕</button>
            </div>

            <form onSubmit={agregarHitoEvolucion} className="mb-4 flex flex-col gap-2">
              <textarea 
                required 
                placeholder="Ej: Hoy ha conseguido mantener 10 bolas cruzadas de revés sin fallar..." 
                value={nuevaNotaEvolucion} 
                onChange={e => setNuevaNotaEvolucion(e.target.value)}
                className="w-full border rounded-xl p-2 text-xs outline-none focus:border-[#1F3D2B] h-16"
              />
              <button type="submit" className="bg-[#1F3D2B] text-white text-xs font-bold py-1.5 rounded-xl hover:bg-[#2F5741] self-end px-3">
                + Añadir Avance
              </button>
            </form>

            <div className="overflow-y-auto flex-1 flex flex-col gap-2 pr-1">
              {(alumnoEvolucion.historial || []).length === 0 ? (
                <p className="text-xs text-gray-400 italic text-center py-4">Sin registro de hitos aún.</p>
              ) : (
                alumnoEvolucion.historial.map(h => (
                  <div key={h.id} className="p-2.5 bg-[#F8F6F0] rounded-xl border border-gray-200/80 text-xs flex justify-between items-start gap-2">
                    <div>
                      <span className="text-[10px] font-bold text-emerald-800 block mb-0.5">{h.fecha}</span>
                      <p className="text-gray-700">{h.nota}</p>
                    </div>
                    <button onClick={() => eliminarHitoHistorial(alumnoEvolucion.id, h.id)} className="text-gray-300 hover:text-red-500 text-xs">✕</button>
                  </div>
                ))
              )}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ------------------- PESTAÑA BIBLIOTECA DE EJERCICIOS -------------------
function TabEjercicios({ data, updateData }) {
  const [titulo, setTitulo] = useState("");
  const [categoria, setCategoria] = useState(CATEGORIAS_EJERCICIO[0]);
  const [nivel, setNivel] = useState(NIVELES[0]);
  const [descripcion, setDescripcion] = useState("");

  const agregarEjercicio = (e) => {
    e.preventDefault();
    if (!titulo.trim()) return;
    const nuevo = { id: uid(), titulo: titulo.trim(), categoria, nivel, descripcion: descripcion.trim() };
    updateData("ejercicios", [...data.ejercicios, nuevo]);
    setTitulo(""); setDescripcion("");
  };

  const eliminarEjercicio = (id) => {
    updateData("ejercicios", data.ejercicios.filter(e => e.id !== id));
  };

  return (
    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
      <form onSubmit={agregarEjercicio} className="bg-white p-5 rounded-2xl border border-[#E3DFD3] shadow-xs h-fit flex flex-col gap-3">
        <h3 className="font-bold text-sm text-gray-800">Registrar Ejercicio Favorito</h3>
        <div>
          <label className="text-xs font-semibold text-gray-500 block mb-1">Título del Ejercicio</label>
          <input type="text" required placeholder="Ej: Rayo de volea" value={titulo} onChange={e => setTitulo(e.target.value)} className="w-full border rounded-xl p-2 text-xs outline-none" />
        </div>
        <div>
          <label className="text-xs font-semibold text-gray-500 block mb-1">Categoría</label>
          <select value={categoria} onChange={e => setCategoria(e.target.value)} className="w-full border rounded-xl p-2 text-xs outline-none">
            {CATEGORIAS_EJERCICIO.map(c => <option key={c}>{c}</option>)}
          </select>
        </div>
        <div>
          <label className="text-xs font-semibold text-gray-500 block mb-1">Nivel Recomendado</label>
          <select value={nivel} onChange={e => setNivel(e.target.value)} className="w-full border rounded-xl p-2 text-xs outline-none">
            {NIVELES.map(n => <option key={n}>{n}</option>)}
          </select>
        </div>
        <div>
          <label className="text-xs font-semibold text-gray-500 block mb-1">Descripción / Reglas del Ejercicio</label>
          <textarea placeholder="Explica cómo se ejecuta, rotaciones, variantes..." value={descripcion} onChange={e => setDescripcion(e.target.value)} className="w-full border rounded-xl p-2 text-xs outline-none h-24" />
        </div>
        <button type="submit" className="bg-[#1F3D2B] text-white text-xs font-bold py-2.5 rounded-xl hover:bg-[#2F5741]">Guardar Ejercicio</button>
      </form>

      <div className="md:col-span-2 flex flex-col gap-4">
        {CATEGORIAS_EJERCICIO.map(cat => {
          const ejerCat = data.ejercicios.filter(e => e.categoria === cat);
          if (ejerCat.length === 0) return null;

          return (
            <div key={cat} className="bg-white p-5 rounded-2xl border border-[#E3DFD3] shadow-xs">
              <h4 className="font-bold text-sm text-[#1F3D2B] mb-3">{cat}</h4>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                {ejerCat.map(e => (
                  <div key={e.id} className="p-3 bg-[#F8F6F0] rounded-xl border border-gray-200/60 relative">
                    <button onClick={() => eliminarEjercicio(e.id)} className="absolute top-2 right-2 text-xs text-gray-400 hover:text-red-500">✕</button>
                    <span className="font-bold text-xs text-gray-800 block">{e.titulo}</span>
                    <span className="inline-block bg-gray-200 text-gray-700 text-[9px] font-bold px-1.5 py-0.5 rounded my-1">{e.nivel}</span>
                    <p className="text-xs text-gray-600 mt-1">{e.descripcion}</p>
                  </div>
                ))}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ------------------- PESTAÑA DIARIO DE CLASES -------------------
function TabDiario({ data, updateData }) {
  const [grupoId, setGrupoId] = useState(data.grupos[0]?.id || "");
  const [fecha, setFecha] = useState(fechaHoy());
  const [resumen, setResumen] = useState("");
  const [feedback, setFeedback] = useState("");

  const agregarSesion = (e) => {
    e.preventDefault();
    if (!resumen.trim() || !grupoId) return;
    const nueva = { id: uid(), grupoId, fecha, resumen: resumen.trim(), feedback: feedback.trim() };
    updateData("diario", [nueva, ...data.diario]);
    setResumen(""); setFeedback("");
  };

  return (
    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
      <form onSubmit={agregarSesion} className="bg-white p-5 rounded-2xl border border-[#E3DFD3] shadow-xs h-fit flex flex-col gap-3">
        <h3 className="font-bold text-sm text-gray-800">Anotar Clase Impartida</h3>
        <div>
          <label className="text-xs font-semibold text-gray-500 block mb-1">Grupo</label>
          <select value={grupoId} onChange={e => setGrupoId(e.target.value)} className="w-full border rounded-xl p-2 text-xs outline-none">
            {data.grupos.map(g => <option key={g.id} value={g.id}>{g.nombre}</option>)}
          </select>
        </div>
        <div>
          <label className="text-xs font-semibold text-gray-500 block mb-1">Fecha</label>
          <input type="date" value={fecha} onChange={e => setFecha(e.target.value)} className="w-full border rounded-xl p-2 text-xs outline-none" />
        </div>
        <div>
          <label className="text-xs font-semibold text-gray-500 block mb-1">Contenido Trabajado</label>
          <textarea placeholder="Ej: Trabajo de voleas de ataque y saques" value={resumen} onChange={e => setResumen(e.target.value)} className="w-full border rounded-xl p-2 text-xs outline-none h-20" />
        </div>
        <div>
          <label className="text-xs font-semibold text-gray-500 block mb-1">Feedback del Entrenador (Para la IA)</label>
          <textarea placeholder="Ej: Les costó mucho la volea alta, reducir dificultad la próxima clase" value={feedback} onChange={e => setFeedback(e.target.value)} className="w-full border rounded-xl p-2 text-xs outline-none h-20" />
        </div>
        <button type="submit" className="bg-[#1F3D2B] text-white text-xs font-bold py-2.5 rounded-xl hover:bg-[#2F5741]">Registrar en Diario</button>
      </form>

      <div className="md:col-span-2 flex flex-col gap-3">
        {data.diario.length === 0 ? (
          <div className="bg-white p-8 rounded-2xl border text-center text-xs text-gray-400">Sin clases registradas aún.</div>
        ) : (
          data.diario.map(s => {
            const grupo = data.grupos.find(g => g.id === s.grupoId);
            return (
              <div key={s.id} className="bg-white p-4 rounded-2xl border border-[#E3DFD3] shadow-xs flex flex-col gap-2">
                <div className="flex justify-between items-center border-b pb-1.5">
                  <span className="font-bold text-xs text-[#1F3D2B]">{grupo?.nombre || "Grupo borrado"}</span>
                  <span className="text-[10px] font-semibold text-gray-400">{s.fecha}</span>
                </div>
                <p className="text-xs text-gray-700"><strong>Trabajado:</strong> {s.resumen}</p>
                {s.feedback && (
                  <p className="text-xs text-amber-800 bg-amber-50 p-2 rounded-lg border border-amber-200/50">
                    <strong>Feedback / Notas:</strong> {s.feedback}
                  </p>
                )}
              </div>
            );
          })
        )}
      </div>
    </div>
  );
}

// ------------------- PESTAÑA MOTOR DE IA -------------------
function TabIA({ data, updateData }) {
  const [modo, setModo] = useState("clase"); // "clase" o "informe"
  const [grupoId, setGrupoId] = useState(data.grupos[0]?.id || "");
  const [alumnoId, setAlumnoId] = useState(data.alumnos[0]?.id || "");
  const [objetivoClase, setObjetivoClase] = useState("Ataque y juego en la red (Volea / Remate)");
  const [cargando, setCargando] = useState(false);
  const [resultadoIA, setResultadoIA] = useState("");
  const [errorAPI, setErrorAPI] = useState("");

  const ejecutarIA = async () => {
    if (!data.apiKey) {
      setErrorAPI("Falta configurar tu API Key. Haz clic en '⚙️ Configuración API' arriba a la derecha.");
      return;
    }
    setErrorAPI("");
    setCargando(true);
    setResultadoIA("");

    const grupoSel = data.grupos.find(g => g.id === grupoId);
    const alumnosGrupo = data.alumnos.filter(a => a.grupoId === grupoId);
    const ultimasClases = data.diario.filter(d => d.grupoId === grupoId).slice(0, 4);

    let systemPrompt = "";
    let userPrompt = "";

    if (modo === "clase") {
      systemPrompt = "Eres un Director Técnico y Entrenador de Tenis de Elite. Genera sesiones de entrenamiento altamente profesionales, pedagógicas, estructuradas minuto a minuto y motivadoras.";
      
      userPrompt = `
Genera una propuesta de clase de tenis estructurada de 60 minutos con el siguiente contexto:

1. GRUPO: "${grupoSel?.nombre || 'General'}" (Nivel: ${grupoSel?.nivel}, Objetivo General: "${grupoSel?.objetivo || 'Consistencia'}")
2. OBJETIVO ESPECÍFICO DE HOY: "${objetivoClase}"
3. ALUMNOS EN PISTA:
${alumnosGrupo.map(a => `- ${a.nombre}: Puntos fuertes (${a.fortalezas || 'N/A'}), A mejorar (${a.aMejorar || 'N/A'})`).join('\n')}

4. ÚLTIMAS CLASES IMPARTIDAS Y FEEDBACK REGISTRADO:
${ultimasClases.length === 0 ? "Sin historial previo." : ultimasClases.map(c => `- ${c.fecha}: ${c.resumen} (Feedback: ${c.feedback || 'Sin notas'})`).join('\n')}

5. MI BIBLIOTECA DE EJERCICIOS DISPONIBLES (Prioriza usar o adaptar estos ejercicios si encajan con el objetivo):
${data.ejercicios.map(e => `- [${e.categoria}] ${e.titulo}: ${e.descripcion}`).join('\n')}

FORMATO REQUERIDO DE LA RESPUESTA:
- **Estructura en 3 Bloques**: 
  1. Calentamiento y Coordinación (10 min)
  2. Parte Principal - Progresión Técnica/Táctica (35 min - 2 ejercicios progresivos)
  3. Juego / Puntos / Competición Aplicada (15 min)
- **Atención a detalles individuales**: Menciona en qué fijarse específicamente con algún alumno durante la sesión según sus áreas a mejorar.
- Usa un tono directo, claro y profesional de entrenador.
`;
    } else {
      // Modo Informe Alumno
      const alumSel = data.alumnos.find(a => a.id === alumnoId);
      systemPrompt = "Eres un Entrenador de Tenis redactando informes formales de evaluación para alumnos y padres.";
      userPrompt = `
Redacta un informe de evaluación técnico-táctica formal y alentador para la temporada/etapa de tenis con la siguiente información:

- Alumno: ${alumSel?.nombre}
- Grupo / Nivel: ${grupoSel?.nombre} (${grupoSel?.nivel})
- Puntos Fuertes Identificados: ${alumSel?.fortalezas || 'Pared de fondo, constancia'}
- Áreas de Trabajo Principales: ${alumSel?.aMejorar || 'Empuñaduras y saques'}
- HISTORIAL Y LÍNEA DE TIEMPO DE AVANCES REGISTRADOS:
${(alumSel?.historial || []).map(h => `- [${h.fecha}]: ${h.nota}`).join('\n')}

ESTRUCTURA DEL INFORME:
1. Resumen Ejecutivo de la Evolución.
2. Aspectos Técnicos y Tácticos Destacados.
3. Compromiso y Actitud en Pista.
4. Objetivos y Recomendaciones para la Siguiente Etapa.
`;
    }

    // ✅ Timeout de 30 segundos usando AbortController
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 30000);

    try {
      let textoGenerado = "";

      if (data.apiProveedor === "openai") {
        const res = await fetch("https://api.openai.com/v1/chat/completions", {
          method: "POST",
          signal: controller.signal,
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${data.apiKey.trim()}`
          },
          body: JSON.stringify({
            model: "gpt-4o-mini",
            messages: [
              { role: "system", content: systemPrompt },
              { role: "user", content: userPrompt }
            ],
            temperature: 0.7
          })
        });

        if (!res.ok) {
          const errData = await res.json().catch(() => ({}));
          throw new Error(errData.error?.message || `Error en la API de OpenAI (Código: ${res.status})`);
        }

        const jsonRes = await res.json();
        textoGenerado = jsonRes.choices?.[0]?.message?.content;

      } else {
        // ✅ Conexión robusta y limpia con Gemini v1
        const res = await fetch(`https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash:generateContent?key=${data.apiKey.trim()}`, {
          method: "POST",
          signal: controller.signal,
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [
              {
                role: "user",
                parts: [
                  { text: `${systemPrompt}\n\n${userPrompt}` }
                ]
              }
            ]
          })
        });

        if (!res.ok) {
          const errData = await res.json().catch(() => ({}));
          throw new Error(errData.error?.message || `Error en la API de Gemini (Código: ${res.status}). Revisa la validez de tu API Key.`);
        }

        const jsonRes = await res.json();
        textoGenerado = jsonRes.candidates?.[0]?.content?.parts?.[0]?.text;
      }

      // ✅ Validación de respuesta vacía
      if (!textoGenerado || textoGenerado.trim() === "") {
        throw new Error("El modelo de IA devolvió una respuesta vacía. Por favor, vuelve a intentarlo.");
      }

      setResultadoIA(textoGenerado);

    } catch (err) {
      if (err.name === 'AbortError') {
        setErrorAPI("La solicitud ha caducado (Timeout 30s). Comprueba tu conexión a internet e inténtalo de nuevo.");
      } else {
        setErrorAPI(err.message || "Error al conectar con el servicio de IA.");
      }
    } finally {
      // ✅ Corrección estructural: bloque finally limpio
      clearTimeout(timeoutId);
      setCargando(false);
    }
  };

  const guardarClaseEnDiario = () => {
    if (!resultadoIA || modo !== "clase") return;
    const nuevaSesion = {
      id: uid(),
      grupoId: grupoId,
      fecha: fechaHoy(),
      resumen: `[IA] Objetivo: ${objetivoClase}\n\n${resultadoIA.slice(0, 300)}...`,
      feedback: "Generada automáticamente por Copiloto IA."
    };
    updateData("diario", [nuevaSesion, ...data.diario]);
    alert("¡Clase guardada exitosamente en tu Diario de Clases!");
  };

  return (
    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
      {/* Formulario de Parámetros */}
      <div className="bg-white p-5 rounded-2xl border border-[#E3DFD3] shadow-xs flex flex-col gap-4 h-fit">
        <div>
          <h3 className="font-extrabold text-base text-[#1F3D2B] mb-1">🤖 Generador IA</h3>
          <p className="text-xs text-gray-500">Aprende de tus ejercicios y del historial de tu escuela.</p>
        </div>

        {/* Selector de Modo */}
        <div className="flex bg-[#F8F6F0] p-1 rounded-xl border border-gray-200">
          <button 
            onClick={() => setModo("clase")}
            className={`flex-1 py-1.5 text-xs font-bold rounded-lg transition-all ${modo === "clase" ? "bg-[#1F3D2B] text-white shadow-xs" : "text-gray-500 hover:text-gray-800"}`}
          >
            🎾 Planificar Clase
          </button>
          <button 
            onClick={() => setModo("informe")}
            className={`flex-1 py-1.5 text-xs font-bold rounded-lg transition-all ${modo === "informe" ? "bg-[#1F3D2B] text-white shadow-xs" : "text-gray-500 hover:text-gray-800"}`}
          >
            📋 Informe Alumno
          </button>
        </div>

        {modo === "clase" ? (
          <>
            <div>
              <label className="text-xs font-semibold text-gray-500 block mb-1">Seleccionar Grupo</label>
              <select value={grupoId} onChange={e => setGrupoId(e.target.value)} className="w-full border rounded-xl p-2 text-xs outline-none">
                {data.grupos.map(g => <option key={g.id} value={g.id}>{g.nombre} ({g.nivel})</option>)}
              </select>
            </div>
            <div>
              <label className="text-xs font-semibold text-gray-500 block mb-1">Objetivo Técnico / Táctico de la Clase</label>
              <textarea 
                placeholder="Ej: Trabajo de profundidades de revés y cierre con volea alta..." 
                value={objetivoClase} 
                onChange={e => setObjetivoClase(e.target.value)}
                className="w-full border rounded-xl p-2 text-xs outline-none h-24"
              />
            </div>
          </>
        ) : (
          <>
            <div>
              <label className="text-xs font-semibold text-gray-500 block mb-1">Seleccionar Alumno</label>
              <select value={alumnoId} onChange={e => setAlumnoId(e.target.value)} className="w-full border rounded-xl p-2 text-xs outline-none">
                {data.alumnos.map(a => <option key={a.id} value={a.id}>{a.nombre}</option>)}
              </select>
            </div>
          </>
        )}

        {errorAPI && (
          <div className="p-3 bg-red-50 border border-red-200 text-red-700 text-xs rounded-xl">
            ⚠️ {errorAPI}
          </div>
        )}

        <button 
          onClick={ejecutarIA} 
          disabled={cargando}
          className="bg-[#1F3D2B] text-white font-bold text-xs py-3 rounded-xl hover:bg-[#2F5741] transition-all flex items-center justify-center gap-2 shadow-sm disabled:opacity-50"
        >
          {cargando ? (
            <>
              <span className="animate-spin">🌀</span>
              <span>Procesando contexto...</span>
            </>
          ) : (
            <>
              <span>✨ Generar con IA</span>
            </>
          )}
        </button>
      </div>

      {/* Visor de Resultados */}
      <div className="lg:col-span-2 bg-white p-6 rounded-2xl border border-[#E3DFD3] shadow-xs min-h-[400px] flex flex-col justify-between">
        <div>
          <div className="flex justify-between items-center border-b pb-3 mb-4">
            <h4 className="font-bold text-sm text-gray-800">
              {modo === "clase" ? "📋 Propuesta de Clase Impartida" : "📄 Informe de Evaluación"}
            </h4>
            {resultadoIA && modo === "clase" && (
              <button 
                onClick={guardarClaseEnDiario}
                className="bg-emerald-100 text-emerald-800 hover:bg-emerald-200 text-xs font-bold px-3 py-1.5 rounded-lg transition-colors"
              >
                💾 Guardar en Diario
              </button>
            )}
          </div>

          {!resultadoIA && !cargando && (
            <div className="text-center py-16 text-gray-400">
              <div className="text-4xl mb-2">💡</div>
              <p className="text-xs">Selecciona las opciones a la izquierda y pulsa <strong>"Generar con IA"</strong>.</p>
              <p className="text-[11px] text-gray-300 mt-1">La IA analizará tus ejercicios guardados e historial para preparar la sesión.</p>
            </div>
          )}

          {cargando && (
            <div className="text-center py-16 text-gray-400 animate-pulse">
              <div className="text-4xl mb-2">🧠</div>
              <p className="text-xs font-semibold text-gray-600">Analizando evoluciones de alumnos y ejercicios...</p>
            </div>
          )}

          {resultadoIA && (
            <div className="prose prose-sm max-w-none text-xs text-gray-700 whitespace-pre-wrap leading-relaxed font-mono bg-[#F8F6F0] p-4 rounded-xl border border-gray-200">
              {resultadoIA}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
